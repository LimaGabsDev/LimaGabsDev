<svg xmlns="http://www.w3.org/2000/svg" width="500" height="100">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000" />   <!-- Vermelho -->
      <stop offset="16%" stop-color="#ff7f00" />  <!-- Laranja -->
      <stop offset="33%" stop-color="#ffff00" />  <!-- Amarelo -->
      <stop offset="50%" stop-color="#00ff00" />  <!-- Verde -->
      <stop offset="66%" stop-color="#0000ff" />  <!-- Azul -->
      <stop offset="83%" stop-color="#4b0082" />  <!-- Índigo -->
      <stop offset="100%" stop-color="#8b00ff" /> <!-- Violeta -->
    </linearGradient>
  </defs>
  
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="bold" fill="url(#rainbow)">
    Welcome
  </text>
</svg>
